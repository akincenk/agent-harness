[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "A small, tested harness for long-running LLM agents: loop budgets, guardrails, sandboxed tools, parallel sub-agents and traces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17.5"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
